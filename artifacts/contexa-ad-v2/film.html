<script>

 for(let j=0;j<3;j++){
   const y=294+j*98;c.strokeStyle='#dce8d2';c.lineWidth=2;c.beginPath();c.moveTo(355,y);c.bezierCurveTo(435,y,440,394,514,394);c.stroke();

 });c.restore();

 });
 withA(1-ease((t-1)/1.2),()=>{c.save();c.translate(-t*45,t*15);miniFile(100,583,'marketing.css','CSS',false,260);c.restore()});
 for(let j=0;j<3;j++){c.strokeStyle='#d7e6cc';c.lineWidth=2;c.beginPath();c.moveTo(439,274+j*111);c.bezierCurveTo(515,274+j*111,510,389,575,389);c.stroke();let p=((t*.7+j*.3)%1);c.fillStyle=GREEN;c.beginPath();c.arc(439+136*p,lerp(274+j*111,389,smooth(p)),3,0,7);c.fill()}
 rise(t,.5,()=>{icon(575,348,82);});arrow(702,389,42);

// 31–36: the repeatable workflow is the benefit, not an unverified numerical claim.
function workflow(t){

const CUTS=[0,4.5,8.8,14.5,20,26,31,36,40],SCENES=[hook,reveal,engine,task,select,handoff,workflow,close];

 if(local<.42&&i>0){let p=smooth(local/.42);c.save();c.globalAlpha=1-p;c.translate(-p*120,0);SCENES[i-1](CUTS[i]-CUTS[i-1]+local);c.restore();c.save();c.globalAlpha=p;c.translate((1-p)*120,0);SCENES[i](local);c.restore()}else SCENES[i](local);
};
