name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Test-only, ephemeral, never used for anything real — regenerated on
      # every run rather than committed as a fixed literal (see the
      # "Generate test-only secrets" step below), so there's nothing here
      # to accidentally get wrong or to mistake for a real credential.
      DJANGO_SECRET_KEY: ci-test-only-not-a-real-secret
      TRANSIT_PRIVATE_KEY: "not-a-real-key-but-non-empty"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ingestion drivers for transport/schema tests
        working-directory: Rest Saas/ingestion/ingestion-engine
        run: npm ci
      - name: Install dependencies
        working-directory: Rest Saas
        run: pip install -r requirements-dev.txt
      - name: Generate test-only secrets
        # FIELD_ENCRYPTION_KEY must be a real, validly-formatted Fernet key
        # — core/crypto.py constructs a real Fernet() from it, and the test
        # suite's tenancy fixtures actually call encrypt via
        # DataSourceConnection.set_config(). Generated fresh each run
        # instead of a hardcoded literal in this file.
        run: echo "FIELD_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Django system check
        working-directory: Rest Saas
        run: python manage.py check
      - name: Check for missing migrations
        working-directory: Rest Saas
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        working-directory: Rest Saas
        run: pytest -v
      - name: Check context contracts on pinned application fixtures
        run: python docs/benchmarks/run_context_checks.py
      - name: Check FastAPI and Next.js context contracts
        run: python docs/benchmarks/expanded_checks.py
      - name: Audit installed backend dependencies
        working-directory: Rest Saas
        run: python -m pip_audit --local

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "Rest Saas Frontend/package-lock.json"
      - name: Install dependencies
        working-directory: Rest Saas Frontend
        run: npm ci
      - name: Build
        working-directory: Rest Saas Frontend
        run: npm run build
      - name: Test user workflows
        working-directory: Rest Saas Frontend
        run: npm test
      - name: Audit frontend runtime and development dependencies
        working-directory: Rest Saas Frontend
        run: npm audit

  ingestion-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "Rest Saas/ingestion/ingestion-engine/package-lock.json"
      - name: Install dependencies
        working-directory: Rest Saas/ingestion/ingestion-engine
        run: npm ci
      - name: Syntax-check every module loads
        working-directory: Rest Saas/ingestion/ingestion-engine
        run: node -e "require('./src/index.js'); require('./src/context-filter.js'); require('./src/graph-builder.js'); require('./src/summary-builder.js'); require('./src/ssrf-guard.js'); require('./src/env-parser.js'); console.log('all modules load cleanly')"
      - name: Check static parser and runtime dependency audit
        working-directory: Rest Saas/ingestion/ingestion-engine
        run: |
          node -e "const {extract}=require('./src/source-units'); const r=extract({path:'a.ts',content:'export function invoice(): number { return 1; }'}); if(r.parse_error || r.units.length!==1) process.exit(1)"
          npm audit --omit=dev

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend, ingestion-engine]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t contexa-backend:ci 'Rest Saas'
      - name: Verify unprivileged runtime and installed static parser
        run: |
          docker run --rm contexa-backend:ci node -e "if(Number(process.versions.node.split('.')[0])!==22) process.exit(1); if(process.getuid()===0) process.exit(1); require('./ingestion/ingestion-engine/src/source-units')"
          docker run --rm contexa-backend:ci python -c "from pathlib import Path; assert not Path('/app/.env').exists(); assert not Path('/app/db.sqlite3').exists()"
